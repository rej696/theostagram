<!DOCTYPE html>
<html>
    <head>
        <title>Peacock Dreams</title>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="{{ style }}">
    </head>
    <body>
        <div class="heading">
            <it>Peacock Dreams</it>
        </div>

        <div class="blog">
            <h2>Posts:</h2>
            <ul>
                {% for page in pages %}
                <li><a href="{{ url_for('page', name=page.path.replace('blog/', '')) }}">{{ page.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </body>
</html>
